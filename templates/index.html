<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- 휴대폰에서 두 손가락으로 벌려 키우면 단추가 화면 밖으로 나간다.
         꽉 찬 한 판으로 쓰는 화면이라 늘리지 않는다. 안전 영역(노치)
         만큼은 비워 둔다. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0,
                                   maximum-scale=1.0, user-scalable=no,
                                   viewport-fit=cover">

    <!-- 홈 화면에 얹으면 앱처럼 열린다(주소창 없이) -->
    <link rel="manifest" href="/static/app/manifest.webmanifest">
    <meta name="theme-color" content="#0e1020">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="다이아">
    <link rel="apple-touch-icon" href="/static/app/icon-192.png">

    <title>diamondAI - Virtual Avatar</title>

    <!-- THREE.js 및 THREE-VRM CDN -->
    <script src="https://unpkg.com/three@0.137.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.137.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://unpkg.com/three@0.137.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://unpkg.com/@pixiv/three-vrm@0.6.11/lib/three-vrm.js"></script>
    <!-- 노래는 목소리(TTS)로 안 된다. 음정은 여기서 짓는다. -->
    <script src="/static/singer.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a24;
            color: #fff;
            display: flex;
            height: 100vh;

            /* 휴대폰에서 100vh 는 **주소창을 뺀 높이가 아니다.**
               주소창이 보이는 동안에는 화면보다 크고, 그만큼 아래가
               잘린다. 실제로 폰에서 메시지 입력칸이 화면 밖으로 밀려
               '상황 쓰기' 칸만 보였다. dvh 는 지금 실제로 보이는
               높이다. 모르는 브라우저는 위의 100vh 를 쓴다. */
            height: 100dvh;
            overflow: hidden;
        }

        #avatar-container {
            flex: 1;
            position: relative;
            background: radial-gradient(circle, #2c2d42 0%, #0f0f17 100%);
        }

        #canvas3d {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* 지금 무엇으로 만지는지 */
        #tool-badge {
            position: absolute;
            left: 14px;
            top: 14px;
            background: rgba(20, 22, 42, 0.72);
            border: 1px solid #3a3f68;
            color: #dfe1f0;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 0.85rem;
            z-index: 12;
            cursor: context-menu;
            user-select: none;
        }

        /* 가위바위보 */
        /* 가위바위보.
           손 단추를 아래로 펼치면 눈 단추(96px)를 덮는다.
           옆으로 펼치면 아래에 무엇이 오든 겹치지 않는다. */
        #rps-bar {
            position: absolute;
            left: 14px;
            top: 52px;
            z-index: 12;
            user-select: none;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        #rps-open,
        #chess-open {
            background: rgba(20, 22, 42, 0.72);
            border: 1px solid #3a3f68;
            color: #dfe1f0;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 0.85rem;
            cursor: pointer;
            font-family: inherit;
        }

        /* 옷장.
           오른쪽 아래. 이름표(who-badge, bottom 20)를 덮지 않게 그 위에 둔다.
           목록은 위로 펼친다 — 아래로 펼치면 화면 밖으로 나간다. */
        #wear-bar {
            position: absolute;
            right: 14px;
            bottom: 64px;
            z-index: 13;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
            user-select: none;
        }

        #wear-open,
        #look-open {
            background: rgba(20, 22, 42, 0.72);
            border: 1px solid #3a3f68;
            color: #dfe1f0;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 0.85rem;
            cursor: pointer;
            font-family: inherit;
        }

        #wear-menu,
        #look-menu {
            display: none;
            flex-direction: column;
            gap: 4px;
            background: rgba(20, 22, 42, 0.92);
            border: 1px solid #3a3f68;
            border-radius: 10px;
            padding: 6px;
            max-height: 40vh;
            overflow-y: auto;
        }

        #wear-menu.on,
        #look-menu.on {
            display: flex;
        }

        #wear-menu button,
        #look-menu button {
            background: transparent;
            border: 1px solid transparent;
            color: #dfe1f0;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-family: inherit;
            cursor: pointer;
            text-align: right;
            white-space: nowrap;
        }

        #wear-menu button:hover,
        #look-menu button:hover {
            background: rgba(90, 96, 150, 0.35);
        }

        #wear-menu button.on,
        #look-menu button.on {
            border-color: #6f76b8;
            color: #fff;
        }

        #wear-menu .cap,
        #look-menu .cap {
            color: #8f93b8;
            font-size: 0.72rem;
            padding: 2px 12px 4px;
            text-align: right;
        }

        /* 눈 — 사진과 카메라 */
        #eye-bar {
            position: absolute;
            left: 14px;
            top: 96px;
            z-index: 12;
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: flex-start;
            user-select: none;
        }

        #eye-bar button {
            width: 38px;
            height: 32px;
            background: rgba(20, 22, 42, 0.72);
            border: 1px solid #3a3f68;
            color: #dfe1f0;
            border-radius: 999px;
            font-size: 0.95rem;
            cursor: pointer;
            font-family: inherit;
        }

        #eye-bar button:hover { background: rgba(42, 47, 82, 0.9); }
        #eye-bar button.on { background: #4a3f77; border-color: #7a68b0; }

        /* 듣고 있는 동안 숨쉬듯 밝아진다. 켜졌는지 눈으로 알아야 한다. */
        #eye-mic.on { animation: miclive 1.4s ease-in-out infinite; }

        @keyframes miclive {
            0%, 100% { background: #4a3f77; }
            50%      { background: #6b58a8; }
        }

        /* 알아듣고 있는 말. 확정 전이라 흐리게 둔다. */
        #mic-draft {
            position: fixed;
            left: 50%;
            bottom: 150px;
            transform: translateX(-50%);
            max-width: 60%;
            padding: 6px 13px;
            border-radius: 14px;
            background: rgba(74, 63, 119, 0.8);
            color: #e6e3f5;
            font-size: 0.85rem;
            z-index: 41;
            pointer-events: none;
            display: none;
        }

        /* 카메라가 켜졌을 때만 보이는 작은 미리보기.
           내가 무엇을 보여 주고 있는지 알아야 한다. */
        #eye-video {
            display: none;
            width: 132px;
            border: 1px solid #3a3f68;
            border-radius: 8px;
            /* 거울처럼 뒤집는다 — 안 뒤집으면 손을 드는 방향이 반대다 */
            transform: scaleX(-1);
        }

        #eye-video.on { display: block; }

        /* ----------------------------------------------------------
           조이스틱 — 마우스로 걷기

           방향키와 같은 축을 만든다. 위아래는 걷기, 좌우는 돌아서기.
           키와 달리 세기가 있어서 살살 밀면 천천히 간다.
           ---------------------------------------------------------- */
        #stick-pad {
            position: absolute;
            left: 20px;
            bottom: 20px;
            width: 118px;
            height: 118px;
            border-radius: 50%;
            background: rgba(20, 22, 42, 0.55);
            border: 1px solid #3a3f68;
            z-index: 13;
            touch-action: none;
            user-select: none;
            cursor: grab;
        }

        #stick-pad.grabbed { cursor: grabbing; }

        /* 가운데 십자. 어느 쪽이 앞인지 알려 준다 */
        #stick-pad::before,
        #stick-pad::after {
            content: '';
            position: absolute;
            background: #3a3f68;
            opacity: 0.5;
        }

        #stick-pad::before {
            left: 50%; top: 17px; bottom: 17px;
            width: 1px; margin-left: -0.5px;
        }

        #stick-pad::after {
            top: 50%; left: 17px; right: 17px;
            height: 1px; margin-top: -0.5px;
        }

        #stick-knob {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 46px;
            height: 46px;
            margin: -23px 0 0 -23px;
            border-radius: 50%;
            background: rgba(96, 104, 168, 0.85);
            border: 1px solid #8b93d4;
            pointer-events: none;
        }

        #stick-pad.grabbed #stick-knob {
            background: rgba(132, 142, 220, 0.95);
        }

        /* 체스판.
           가운데에 두면 다이아 얼굴을 가린다. 그래서 옆으로 비킨다.

           **다이아 기준 오른쪽 = 화면 왼쪽**이다. 이쪽을 보고 서 있으니
           그의 오른손은 우리가 볼 때 왼쪽에 있다.

           그 자리에는 눈 단추 줄(왼쪽 14~52px, 위 96px부터)이 있어서
           그 옆으로 세운다(왼쪽 62px). 아래로는 조이스틱(아래 20px에서
           138px 높이)을 안 건드리게 판을 32px 칸으로 줄였다. */
        #chess-panel {
            /* 칸 하나의 크기.
               2배로 키웠다(32 -> 64). 다만 창이 낮으면 판이 화면 밖으로
               나가므로 창 높이를 따라 줄어들게 둔다. 아무리 작아도
               34px 아래로는 안 간다 — 그보다 작으면 말이 안 보인다. */
            --sq: clamp(34px, 7.4vh, 64px);

            position: absolute;
            left: 62px;
            top: 96px;
            z-index: 20;
            cursor: default;
            display: none;
            padding: 12px;
            background: rgba(14, 16, 32, 0.94);
            border: 1px solid #3a3f68;
            border-radius: 14px;
            color: #dfe1f0;
            user-select: none;
        }

        #chess-panel.on { display: block; }

        /* 판을 여는 동안은 조이스틱을 감춘다.
           창이 낮으면(높이 500px쯤) 판 아래쪽과 겹친다. 계산해 보면
           판은 위 96에서 448까지고 조이스틱 윗변은 창 높이 - 138 이라,
           창이 586px보다 낮으면 부딪친다.
           체스를 두면서 걸어 다닐 일은 없으므로 감추는 편이 낫다.
           방향키는 그대로 듣는다 — 단추만 감춘 것이다. */
        #avatar-container.chess #stick-pad,
        #avatar-container.chess #stick-keys { display: none; }

        /* 머리를 잡아 끌면 판이 따라온다.
           판이 커져서 어디에 두든 무언가는 가린다. 그러면 자리를
           고정할 게 아니라 옮길 수 있게 하는 편이 낫다. */
        #chess-head {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 9px;
            font-size: 0.82rem;
            cursor: grab;
        }

        #chess-panel.dragging #chess-head { cursor: grabbing; }

        /* 단추는 끌기가 아니라 눌리는 것이다 */
        #chess-head button { cursor: pointer; }

        #chess-turn { flex: 1; color: #b9bcd8; }

        #chess-head button {
            background: rgba(58, 63, 104, 0.5);
            border: 1px solid #4a4f7a;
            color: #dfe1f0;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 0.75rem;
            cursor: pointer;
            font-family: inherit;
        }

        #chess-head button:hover {
            background: #5a4d8d;
            border-color: #7a68b0;
        }

        /* 난이도 고르기 */
        #chess-levels {
            display: flex;
            gap: 4px;
            margin-bottom: 7px;
        }

        #chess-levels button {
            flex: 1;
            padding: 4px 0;
            background: rgba(20, 22, 42, 0.72);
            border: 1px solid #3a3f68;
            color: #8a8fb5;
            border-radius: 7px;
            font-size: 0.74rem;
            cursor: pointer;
            font-family: inherit;
        }

        /* 어느 말을 잡을 것인가 */
        #chess-sides {
            display: flex;
            gap: 4px;
            margin-bottom: 7px;
        }

        #chess-sides button {
            flex: 1;
            padding: 4px 0;
            background: rgba(20, 22, 42, 0.72);
            border: 1px solid #3a3f68;
            color: #8a8fb5;
            border-radius: 7px;
            font-size: 0.74rem;
            cursor: pointer;
            font-family: inherit;
        }

        #chess-sides button.on {
            background: #4a3f77;
            border-color: #7a68b0;
            color: #fff;
        }

        /* 선공을 가리는 가위바위보.
           왼쪽 위 가위바위보 단추는 그냥 노는 것이고, 이건 판을
           시작하는 절차다. 둘이 섞이면 무엇을 누르는지 헷갈리므로
           판 안에 따로 둔다. */
        #chess-decide {
            display: none;
            gap: 5px;
            margin-bottom: 8px;
        }

        #chess-decide.on { display: flex; }

        #chess-decide button {
            flex: 1;
            padding: 8px 0;
            background: rgba(74, 63, 119, 0.35);
            border: 1px solid #7a68b0;
            color: #dfe1f0;
            border-radius: 9px;
            font-size: 0.86rem;
            cursor: pointer;
            font-family: inherit;
        }

        #chess-decide button:hover { background: #5a4d8d; }

        /* 선공 정하기 — 오목·장기·할리갈리·끝말잇기.
           어느 놀이든 시작 전에 가위바위보로 먼저 할 사람을 정한다.
           끝말잇기는 판이 없어서, 판 안이 아니라 한가운데 위에 띄운다. */
        #first-box {
            display: none;
            position: absolute;
            left: 50%;
            top: 92px;
            transform: translateX(-50%);
            z-index: 60;
            width: 280px;
            max-width: calc(100% - 32px);
            padding: 10px;
            border-radius: 10px;
            background: rgba(18, 20, 36, 0.94);
            border: 1px solid #7a68b0;
            color: #d8dcf0;
            font-size: 13px;
        }

        #first-box.on { display: block; }

        #first-title {
            margin-bottom: 8px;
            text-align: center;
        }

        #first-btns {
            display: flex;
            gap: 5px;
        }

        #first-btns button {
            flex: 1;
            padding: 8px 0;
            background: rgba(74, 63, 119, 0.35);
            border: 1px solid #7a68b0;
            color: #dfe1f0;
            border-radius: 9px;
            font-size: 0.86rem;
            cursor: pointer;
            font-family: inherit;
        }

        #first-btns button:hover { background: #5a4d8d; }

        /* 선공을 정하는 동안에는 판과 설정을 감춘다.
           아직 무슨 색인지도 안 정했는데 판을 보여 주면 헷갈린다. */
        #chess-panel.deciding #chess-board,
        #chess-panel.deciding #chess-sides,
        #chess-panel.deciding #chess-taken { display: none; }

        #chess-levels button.on {
            background: #4a3f77;
            border-color: #7a68b0;
            color: #fff;
        }

        /* ---------------- 장기 ---------------- */

        #jg-open {
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid #3a3f68;
            background: rgba(30, 34, 58, 0.85);
            color: #d8dcf0;
            font-size: 13px;
            cursor: pointer;
        }
        #jg-open:hover { background: rgba(42, 47, 82, 0.9); }
        #jg-open.on { background: #4a3f77; border-color: #7a68b0; }

        #jg-panel {
            display: none;
            position: absolute;
            left: 12px;
            top: 92px;
            z-index: 40;
            padding: 10px;
            border-radius: 10px;
            background: rgba(18, 20, 36, 0.94);
            border: 1px solid #3a3f68;
            color: #d8dcf0;
            font-size: 13px;
        }
        #jg-panel.on { display: block; }

        #jg-head { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
        #jg-head span { flex: 1; }
        #jg-head button, #jg-levels button {
            padding: 3px 8px;
            border-radius: 6px;
            border: 1px solid #3a3f68;
            background: #262a45;
            color: #d8dcf0;
            font-size: 12px;
            cursor: pointer;
        }
        #jg-head button:hover, #jg-levels button:hover { background: #333a5e; }
        #jg-levels { display: flex; gap: 4px; margin-bottom: 8px; }
        #jg-levels button.on { background: #4a3f77; border-color: #7a68b0; }

        /* 판. 9칸 × 10줄. 칸 하나가 30px 이라 판이 270×300 이다. */
        #jg-board {
            display: grid;
            grid-template-columns: repeat(9, 30px);
            grid-template-rows: repeat(10, 30px);
            background: #d8b478;
            border: 1px solid #8a6b3f;
            border-radius: 4px;
        }

        .jsq {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .jsq::before {
            content: '';
            position: absolute;
            inset: 0;
            border-right: 1px solid rgba(90, 60, 20, 0.45);
            border-bottom: 1px solid rgba(90, 60, 20, 0.45);
        }
        /* 궁성 — 비스듬한 선이 그어진 자리라 바탕을 달리 한다 */
        .jsq.palace::before { background: rgba(160, 110, 50, 0.18); }

        /* 말. 한(사람)은 붉은 글씨, 초(다이아)는 푸른 글씨 — 장기가 그렇다. */
        .jp {
            position: relative;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            background: #f0dfbe;
            border: 1px solid #7a5a2a;
        }
        .jp.han { color: #b8242a; }
        .jp.cho { color: #1d4ea8; }

        .jsq.pick .jp { box-shadow: 0 0 0 2px #ff5c8a; }
        .jsq.can::after {
            content: '';
            position: absolute;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: rgba(60, 200, 120, 0.75);
        }
        .jsq.last::before { background: rgba(255, 120, 60, 0.22); }

        #jg-msg { margin-top: 8px; min-height: 18px; color: #aab0d0; }

        /* ---------------- 할리갈리 ---------------- */

        #hg-open {
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid #3a3f68;
            background: rgba(30, 34, 58, 0.85);
            color: #d8dcf0;
            font-size: 13px;
            cursor: pointer;
        }
        #hg-open:hover { background: rgba(42, 47, 82, 0.9); }
        #hg-open.on { background: #4a3f77; border-color: #7a68b0; }

        #hg-panel {
            display: none;
            position: absolute;
            left: 12px;
            top: 92px;
            z-index: 40;
            width: 300px;
            padding: 10px;
            border-radius: 10px;
            background: rgba(18, 20, 36, 0.94);
            border: 1px solid #3a3f68;
            color: #d8dcf0;
            font-size: 13px;
        }
        #hg-panel.on { display: block; }

        #hg-head { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
        #hg-head span { flex: 1; }
        #hg-head button, #hg-levels button {
            padding: 3px 8px;
            border-radius: 6px;

        /* 뒤집힌 카드 한 장. 과일과 개수를 큼직하게 —

        .hg-card {

        /* 종. 반사신경 놀이라 크고 누르기 쉬워야 한다. */
        #hg-bell {

        #hg-flip {

        /* ---------------- 오목 ---------------- */

        #go-open {

        #go-panel {

        /* 판. 15칸씩 열다섯 줄. 칸 하나가 22px 이라 판이 330px 이다.
           체스(32px)보다 작게 잡았다 — 15줄이라 그대로 두면 화면을 덮는다.

           **돌은 선과 선이 만나는 자리에 놓인다.** 오목은 체스처럼 칸에
           두는 놀이가 아니다. 처음에는 줄을 칸의 테두리로 그리고 돌을 칸
           가운데에 뒀는데(누르기 쉬우라고), 그러면 돌이 선 사이 빈 칸에
           떠 있어 오목판으로 안 보인다.

           고친 방식: 줄을 **칸 한가운데**로 옮긴다. 칸 가운데가 곧 교점이
           되므로, 돌 자리는 그대로 두고 눌리는 넓이도 22px 그대로다.
           줄은 첫 칸 가운데에서 끝 칸 가운데까지만 긋는다 — 판 가장자리
           바깥으로 삐져나가면 격자가 아니라 표가 된다. */
        #go-board {
            display: grid;
            grid-template-columns: repeat(15, 22px);
            grid-template-rows: repeat(15, 22px);
            background-color: #c9a267;

            /* 22px 마다 한 줄. 11px(반 칸) 밀어 칸 가운데에 오게 하고,
               폭을 21px 줄여 끝 칸 가운데에서 멈추게 한다. */
            background-image:
                repeating-linear-gradient(to right,
                    rgba(74, 48, 16, 0.62) 0 1px, transparent 1px 22px),
                repeating-linear-gradient(to bottom,
                    rgba(74, 48, 16, 0.62) 0 1px, transparent 1px 22px);
            background-position: 10.5px 10.5px;
            background-size: calc(100% - 21px) calc(100% - 21px);
            background-repeat: no-repeat;

            border: 1px solid #8a6b3f;
            border-radius: 4px;
        }

        .gsq {
            position: relative;
            cursor: pointer;
        }

        /* 화점(별). 바둑판의 눈금 노릇을 한다 — 어디쯤인지 세지 않아도
           보인다. 15줄 판에서는 천원과 네 귀 넷이다. */
        .gsq.star::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 50%;
            width: 5px;
            height: 5px;
            margin: -2.5px 0 0 -2.5px;
            border-radius: 50%;
            background: rgba(74, 48, 16, 0.78);
        }
        .gsq:hover::after {
            content: '';
            position: absolute;
            inset: 4px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
        }
        .gsq.has:hover::after { background: none; }

        /* 돌은 칸만큼 크다. 실제 오목판이 그렇다 — 옆 돌과 거의 닿는다.
           작게 두면 교점에 놓아도 점 찍은 것처럼 보인다. */
        .gstone {
            position: absolute;
            inset: 1px;
            border-radius: 50%;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
        }
        .gstone.b { background: radial-gradient(circle at 35% 30%, #555, #000); }
        .gstone.w { background: radial-gradient(circle at 35% 30%, #fff, #bbb); }
        .gstone.last { box-shadow: 0 0 0 2px #ff5c8a; }

        #go-msg { margin-top: 8px; min-height: 18px; color: #aab0d0; }

        /* 판.
           8칸씩 여덟 줄. 칸 하나가 32px 이라 판이 256px 이다. */
        #chess-board {
            display: grid;
            grid-template-columns: repeat(8, var(--sq));
            grid-template-rows: repeat(8, var(--sq));
            border: 1px solid #3a3f68;
            border-radius: 4px;
            overflow: hidden;
        }

        .sq {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: calc(var(--sq) * 0.68);
            line-height: 1;
            cursor: pointer;
            position: relative;
        }

        /* 밝은 칸과 어두운 칸.
           말은 흰 것도 검은 것도 또렷해야 하므로 칸은 너무 밝지도
           어둡지도 않게 둔다. */
        .sq.light { background: #b8bad4; }
        .sq.dark { background: #6f7396; }

        /* 흰 말과 검은 말.
           유니코드 흰 말(♙)은 속이 비어 있어 밝은 칸에서 안 보인다.
           그래서 둘 다 검은 글리프(♟)를 쓰고 색으로만 가른다. */
        .sq .w { color: #ffffff; text-shadow: 0 0 2px #333, 0 1px 2px #0006; }
        .sq .b { color: #1a1a24; text-shadow: 0 0 2px #fff6; }

        /* 지금 고른 말 */
        .sq.pick { background: #7a68b0; }

        /* 그 말이 갈 수 있는 자리 */
        .sq.can::after {
            content: '';
            position: absolute;
            width: calc(var(--sq) * 0.34);
            height: calc(var(--sq) * 0.34);
            border-radius: 50%;
            background: rgba(122, 104, 176, 0.75);
        }

        /* 갈 수 있는데 거기 상대 말이 있으면 = 잡는 자리 */
        .sq.can.take::after {
            width: calc(var(--sq) * 0.84);
            height: calc(var(--sq) * 0.84);
            background: transparent;
            border: 3px solid rgba(224, 138, 154, 0.9);
        }

        /* 방금 둔 수 */
        .sq.last { box-shadow: inset 0 0 0 3px rgba(255, 231, 143, 0.55); }

        /* 장군 맞은 왕 */
        .sq.check { box-shadow: inset 0 0 0 3px rgba(224, 90, 110, 0.95); }

        #chess-taken {
            display: flex;
            gap: 2px;
            min-height: 20px;
            margin-top: 7px;
            font-size: 17px;
            line-height: 1;
            opacity: 0.75;

        #chess-msg {

        /* 누구로 들어와 있는지.
           오른쪽 아래는 비어 있다 — 왼쪽 아래는 조이스틱(20~138px)과

        #who-out:hover { background: #5a4d8d; border-color: #7a68b0; }

        /* 앉기와 점프. 마우스만 쓸 때 Shift·스페이스를 대신한다 */
        #stick-keys {
            position: absolute;
            left: 150px;

            flex-direction: column;

        }

        #stick-keys button {

            border-radius: 50%;
            background: rgba(20, 22, 42, 0.72);
            border: 1px solid #3a3f68;

            font-family: inherit;
            cursor: pointer;
        }

        #stick-keys button:hover { background: rgba(42, 47, 82, 0.9); }
        #stick-keys button.on { background: #4a3f77; border-color: #7a68b0; }

        #rps-open:hover,
        #chess-open:hover { background: rgba(42, 47, 82, 0.9); }

        #rps-open.on,
        #chess-open.on { background: #4a3f77; border-color: #7a68b0; }

        /* 말로 가위바위보를 청했을 때 어느 단추인지 알려준다 */
        #rps-open.call { animation: rpscall 0.85s ease-in-out 4; }

        @keyframes rpscall {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(160, 140, 230, 0.0);

            }

        #rps-hands {

        }

        #rps-hands.open { display: flex; }

        #rps-hands button {

        /* 우클릭 도구 고르기 */
        #tool-menu {
            position: absolute;
            display: none;
            background: #1b1e36;
            border: 1px solid #3a3f68;

        /* 지금 어떤 사이이고 어떤 기분인지 */
        #state-panel {
            position: absolute;
            right: 14px;
            top: 14px;
            width: 210px;
            background: rgba(20, 22, 42, 0.72);
            border: 1px solid #3a3f68;
            border-radius: 12px;
            padding: 11px 13px 12px;
            z-index: 12;
            color: #dfe1f0;

        #state-panel .row {

        }

        #state-panel .cap {
            color: #8f93b8;

        }

        #stage-label { font-weight: 700; }

        #affinity-num {
            margin-left: auto;
            color: #8f93b8;
            font-variant-numeric: tabular-nums;
        }

        #affinity-track {
            position: relative;
            height: 8px;
            margin-top: 8px;
            background: #101228;
            border-radius: 999px;
            overflow: visible;
        }

        #affinity-fill {
            position: absolute;
            left: 0; top: 0; bottom: 0;

        }

        #affinity-marks i {
            position: absolute;
            top: -2px;
            width: 1px;
            height: 12px;
            background: #4a4f78;
        }

        #affinity-knob {
            position: absolute;
            top: -3px;
            width: 14px;
            height: 14px;
            margin-left: -7px;

        #mood-dot {

        }

        /* 친밀도가 움직일 때 뜨는 숫자 */
        #affinity-pop {
            position: absolute;
            right: 26px;
            top: 44px;
            z-index: 13;
            font-weight: 800;
            font-size: 1rem;
            opacity: 0;
            pointer-events: none;

        #affinity-pop.down { color: #ff8b8b; }

            animation: popfloat 1.3s ease-out;

        @keyframes popfloat {
            0%   { opacity: 0; transform: translateY(6px); }
            18%  { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-22px); }
        }

        /* 말풍선 */
        #speech-bubble {
            position: absolute;
            /* 자리는 화면이 매 프레임 얼굴 옆으로 옮긴다.
               아래 값은 아직 머리를 못 찾았을 때만 쓰인다.
               왼쪽 끝을 얼굴에 붙이므로 0, 세로는 가운데 -50%.
               (다이아가 이쪽을 보고 서 있어 그의 왼쪽은 화면에서 오른쪽이다) */
            top: 30%;
            left: 55%;
            transform: translate(0, -50%);
            background: rgba(255, 255, 255, 0.95);
            color: #222;
            padding: 15px 22px;
            border-radius: 18px;
            font-size: 0.95rem;
            max-width: 320px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            display: none;
            z-index: 10;
            font-weight: 600;
            transition: opacity 0.5s ease;

        /* 말풍선은 감춘다(2026-10-05 사용자 지시). 말은 채팅창과 목소리로 간다.
           스크립트가 켜도(display:block) 이 줄이 이긴다. 되돌리려면 이 규칙만 지운다. */
        #speech-bubble { display: none !important; }

        /* 조이스틱과 점프·앉기 단추도 감춘다(2026-10-05 사용자 지시).
           키보드(WASD·스페이스·Shift)는 그대로 된다. 되돌리려면 이 규칙만 지운다. */
        #stick-pad, #stick-keys { display: none !important; }

        #speech-bubble::after {
            content: '';
            position: absolute;
            top: 20px;
            left: -12px;
            border-width: 8px 12px 8px 0;
            border-style: solid;
            border-color:
                transparent
                rgba(255, 255, 255, 0.95)
                transparent
                transparent;
        }

        /* 수면 표시 */
#zzz-indicator {
    position: absolute;

    /* 자리는 CSS 가 정하지 않는다.
       예전에는 top 18% · left 58% 로 화면에 못 박아 두었다.
       카메라가 정물이던 때는 그게 곧 다이아 귀 옆이었지만,
       이제는 카메라가 상대의 눈이라 걸어 다니면 💤 가
       얼굴에서 떨어져 화면에 들러붙어 따라온다.

       그래서 말풍선처럼 머리 자리를 화면 좌표로 투영해
       updateZzzPos() 가 매 프레임 옮긴다. 여기 값은 아직
       한 번도 안 옮겼을 때를 위한 것이다. */
    top: 18%;
    left: 58%;
    font-size: 3.2rem;
    font-weight: bold;
    color: #a29bfe;
    animation: sleepFloat 2s infinite ease-in-out;
    display: none; 
    z-index: 10;
}


        @keyframes sleepFloat {
            0% {
                transform: translateY(0) scale(0.8);
                opacity: 0.3;
            }

            50% {
                transform: translateY(-20px) scale(1.2);
                opacity: 1;
            }

            100% {
                transform: translateY(-40px) scale(0.8);
                opacity: 0;
            }
        }

        #chat-container {
            width: 380px;
            background: #12121a;
            border-left: 1px solid #2a2a3a;
            display: flex;
            flex-direction: column;
        }

        #chat-header {
            padding: 20px;
            background: #1a1a26;
            border-bottom: 1px solid #2a2a3a;
            font-size: 1.2rem;
            font-weight: bold;
            color: #74b9ff;
        }

        #chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .msg {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-break: break-word;
        }

        /* 괄호 안은 말이 아니라 상황이다.
           같은 글씨로 두면 다이아가 그 말을 소리 내어 한 것처럼 읽힌다.
           옅게, 기울여서 — 소설의 지문처럼 보이게 한다. */
        .act {
            opacity: 0.72;
            font-style: italic;
        }

        .user-msg {
            align-self: flex-end;
            background: #0984e3;
            color: #fff;
        }

        .ai-msg {
            align-self: flex-start;
            background: #2d3436;
            color: #dfe6e9;
        }

        /* ----------------------------------------------------------
           상황

           괄호로 상황을 쓸 수 있는데 매번 생각해 내야 하는 것이 일이라,
           지금 흐름에 맞는 것을 몇 개 지어 준다.
           짓는 것은 모델이고 **고르는 것은 사람이다.**
           ---------------------------------------------------------- */
        #situation-bar {
            padding: 10px 15px 0;
            background: #1a1a26;
        }

        #situation-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 8px;
            min-height: 4px;
        }

        #situation-chips button {
            background: rgba(108, 92, 231, 0.16);
            border: 1px solid #3d3560;
            color: #cfc7f0;
            border-radius: 999px;
            padding: 5px 11px;
            font-size: 0.78rem;
            font-family: inherit;
            cursor: pointer;
            text-align: left;
        }

        #situation-chips button:hover {
            background: rgba(108, 92, 231, 0.34);
            border-color: #6c5ce7;
        }

        #situation-chips .waiting {
            color: #6a6a86;
            font-size: 0.76rem;
            padding: 5px 2px;
        }

        #situation-row {
            display: flex;
            gap: 6px;
        }

        #situation-input {
            flex: 1;
            padding: 9px 11px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #14141f;
            color: #cfc7f0;
            outline: none;
            font-size: 0.85rem;
            font-family: inherit;
        }

        #situation-input::placeholder { color: #565672; }

        #situation-row button {
            padding: 9px 12px;
            border-radius: 8px;
            border: 1px solid #3d3560;
            background: rgba(108, 92, 231, 0.16);
            color: #cfc7f0;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.85rem;
        }

        #situation-row button:hover { background: rgba(108, 92, 231, 0.34); }
        #situation-row button:disabled { opacity: 0.45; cursor: default; }

        #chat-input-area {
            padding: 15px;
            background: #1a1a26;
            display: flex;
            gap: 10px;
        }

        #chat-input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #0f0f17;
            color: #fff;
            outline: none;
        }

        #send-btn {
            padding: 12px 18px;
            border-radius: 8px;
            border: none;
            background: #6c5ce7;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }

        #send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* 지난 이야기 펼치기 단추. 넓은 화면에서는 이야기 칸이 늘
           보이므로 쓸 일이 없다. */
        #log-toggle { display: none; }

        /* ============================================================
           비치는 모드 (?clear=1)

           폰 앱에서 열 때 쓴다. 창 자체를 투명하게 두면 **폰 배경화면이
           그대로 비쳐** 다이아가 그 위에 서 있는 것처럼 보인다.

           칠하는 것을 다 걷어내야 한다 — 바탕색 한 겹만 남아도
           뒤가 안 보인다. 바닥 원판과 장소 그림도 같이 끈다(화면 쪽에서).
           단추와 입력칸만 살짝 어둡게 깔아 글씨가 읽히게 한다.
           ============================================================ */
        body.clear,
        body.clear #avatar-container,
        body.clear #chat-container,
        body.clear #chat-header {
            background: transparent;
            background-image: none;
        }

        body.clear #chat-container { border-left: none; border-top: none; }

        body.clear #chat-input-area {
            background: rgba(14, 16, 32, 0.66);
            border-radius: 14px 14px 0 0;
        }

        body.clear #chat-messages {
            background: rgba(10, 12, 24, 0.62);
            border-radius: 14px;
        }

        body.clear #chat-input,
        body.clear #situation-input {
            background: rgba(10, 12, 24, 0.72);
        }

        /* 비치는 동안에는 말풍선이 더 진해야 읽힌다 */
        body.clear #speech-bubble {
            background: rgba(255, 255, 255, 0.97);
        }

        /* ============================================================
           단추 창 모드 (?panel=1)

           배경화면이 된 다이아를 눌렀을 때 뜨는 창이다. **다이아는 안
           그린다** — 그는 이미 배경화면 쪽에 서 있어서, 여기서 또 그리면
           둘이 된다.

           남기는 것은 손·놀이·옷장·꾸미기·사이·이야기 칸이다.
           ============================================================ */
        body.panel #canvas3d,
        body.panel #speech-bubble,
        body.panel #zzz-indicator,
        body.panel #stick-pad,
        body.panel #stick-keys,
        body.panel #tool-menu { display: none !important; }

        /* 다이아가 없으니 위쪽은 단추 자리만 있으면 된다 */
        body.panel #avatar-container {
            flex: none;
            height: 190px;
            min-height: 0;
        }

        /* 도구 막대는 가로로 눕힌다. 세로로 세우면 창을 넘는다. */
        body.panel #eye-bar {
            flex-direction: row;
            top: 104px;
            left: 8px;
        }

        /* 이야기는 늘 보이게. 볼 아바타가 없으니 이게 본문이다. */
        body.panel #chat-messages {
            display: flex !important;
            flex: 1;
            min-height: 0;
            padding: 10px 12px;
            max-height: none;
        }

        body.panel #chat-container { flex: 1; min-height: 0; }

        /* 놀이판이 창을 넘지 않게 */
        body.panel #chess-panel,
        body.panel #jg-panel,
        body.panel #hg-panel,
        body.panel #go-panel { max-height: 52vh; }

        /* ============================================================
           좁은 화면 — 휴대폰

           **가로로 나눠 놓은 것이 깨짐의 원인이다.** 바탕이
           `display: flex` 라 왼쪽이 아바타, 오른쪽이 채팅(380px)인데,
           390px 짜리 화면에서는 채팅이 380 을 가져가고 아바타에 10px 이
           남는다. 그 10px 안에서 단추들이 겹치고 글자가 한 자씩
           세로로 쪼개진다 — '가위바위보' 가 '가/위/바/위/보' 가 된다.
           아바타는 얼굴 한쪽만 화면 끝에 걸린다.

           그래서 **위아래로 쌓는다.** 위가 아바타, 아래가 채팅이다.
           그러면 단추들이 놓일 자리가 화면 너비만큼 생긴다.
           (2026-09-22 에 휴대폰 크기로 찍어 확인)
           ============================================================ */
        @media (max-width: 820px) {

            body { flex-direction: column; }

            /* 아바타는 위. 너무 낮으면 다이아가 잘린다.
               아래에 채팅·상황·입력칸 셋이 들어가야 해서 반보다 조금 적게 준다. */
            #avatar-container {
                flex: none;
                height: 46vh;
                height: 46dvh;
                min-height: 240px;
                width: 100%;
            }

            #chat-container {
                width: 100%;
                flex: 1;
                min-height: 0;          /* 없으면 채팅이 안 줄어든다 */
                border-left: none;
                border-top: 1px solid #2a2a3a;
            }

            /* **좁은 화면에서는 다이아가 먼저다.**
               이야기 칸과 이름표가 화면의 절반을 차지하고 있었는데,
               정작 하고 싶은 것은 다이아를 보는 것이다. 감춰 두고
               말은 말풍선으로 본다. 지난 이야기는 💬 로 펼친다. */
            #chat-header { display: none; }
            #chat-messages { display: none; }

            body.showlog #chat-messages {
                display: flex;
                padding: 12px;
                max-height: 46dvh;
                flex: none;
            }

            #log-toggle {
                display: block;
                padding: 12px 14px;
                border-radius: 8px;
                border: 1px solid #333;
                background: #0f0f17;
                color: #dfe1f0;
                font-size: 1rem;
                cursor: pointer;
            }

            /* 다이아가 남는 자리를 다 쓴다 */
            #avatar-container {
                flex: 1;
                height: auto;
                min-height: 0;
            }

            #chat-container { flex: none; }
            #chat-input-area { padding: 10px 12px; flex-shrink: 0; }

            /* 걷기 손잡이는 감춘다. 좁은 화면에서 자리만 먹고,
               다이아는 스스로도 걸어 다닌다. */
            #stick-pad, #stick-keys { display: none; }

            /* 말풍선은 **얼굴을 가리면 안 된다.**
               머리 옆에 붙이면 좁은 화면에서는 얼굴 위에 올라앉는다.
               아래에 자막처럼 깐다. 왼쪽은 걷기 손잡이 자리를 비운다.
               (화면이 매 프레임 자리를 넣으므로 !important 가 필요하다) */
            #speech-bubble {
                left: 112px !important;
                right: 8px !important;
                top: auto !important;
                bottom: 10px !important;
                transform: none !important;
                width: auto;
                max-width: none;
                max-height: 30vh;
                overflow-y: auto;
                padding: 10px 14px;
                font-size: 0.86rem;
            }

            #speech-bubble::after { display: none; }

            /* 단추.
               놀이 단추 다섯이 한 줄에 다 안 들어가 오른쪽으로 흘러
               사이·기분 칸 뒤로 숨었다. 글씨를 줄이고 두 줄로 접는다. */
            #tool-badge { top: 8px; left: 8px; font-size: 0.76rem; padding: 5px 9px; }

            #rps-bar {
                left: 8px;
                right: 126px;           /* 사이·기분 칸 자리를 비워 둔다 */
                top: 40px;
                flex-wrap: wrap;
                gap: 5px;
            }

            #rps-open, #chess-open, #go-open, #hg-open, #jg-open,
            #wear-open, #look-open { font-size: 0.72rem; padding: 5px 9px; }

            /* 도구 막대는 접힌 놀이 단추 아래로 내린다 */
            #eye-bar { top: 122px; }

            /* 놀이판은 화면을 넘으면 안 된다 */
            #chess-panel, #jg-panel, #hg-panel, #go-panel {
                left: 8px;
                right: 8px;
                width: auto;
                max-width: none;
                max-height: 44vh;
                overflow-y: auto;
            }

            /* 사이·기분 칸은 작게. 놀이 단추와 겹치지 않게 폭을 줄인다. */
            #state-panel {
                right: 6px;
                top: 6px;
                width: 150px;
                font-size: 0.74rem;
                transform: scale(0.82);
                transform-origin: top right;
                opacity: 0.92;
            }

            /* 걷기 손잡이. 아바타 칸 안에 있어야 채팅을 안 덮는다. */
            #stick-pad {
                width: 96px;
                height: 96px;
                left: 12px;
                bottom: 12px;
                opacity: 0.55;
            }

            #stick-knob { width: 38px; height: 38px; }

            /* 점프·앉기가 54px 씩이라 다이아 몸을 덮었다.
               작게 줄이고 손잡이 옆에 가로로 붙인다. */
            #stick-keys {
                left: 114px;
                bottom: 12px;
                flex-direction: row;
                gap: 6px;
                opacity: 0.6;
            }

            #stick-keys button {
                width: 42px;
                height: 42px;
                font-size: 0.68rem;
            }

            #wear-bar { bottom: 56px; }
            #who-badge { bottom: 14px; font-size: 0.78rem; }

            /* 옷장·꾸미기 목록이 화면 밖으로 나가지 않게 */
            #wear-menu, #look-menu { max-height: 34vh; }
        }

        /* 아주 좁은 화면(구형 폰). 아바타를 조금 더 준다. */
        @media (max-width: 400px) {
            #avatar-container { height: 48vh; min-height: 240px; }
            #state-panel { width: 148px; transform: scale(0.88); }
        }
    </style>
</head>

<body>

    <div id="avatar-container">

        <div id="speech-bubble">...</div>

        <div id="zzz-indicator">💤</div>

        <canvas id="canvas3d"></canvas>

        <!-- 지금 무엇으로 만지고 있는지 -->
        <div id="tool-badge" title="우클릭해서 바꾸기">🖐 손</div>

        <!-- 놀이 -->
        <div id="rps-bar">
            <button id="rps-open">✌ 가위바위보</button>
            <button id="chess-open">♟ 체스</button>
            <button id="go-open">⚫ 오목</button>
            <button id="hg-open">🔔 할리갈리</button>
            <button id="jg-open">漢 장기</button>
            <div id="rps-hands"></div>
        </div>

        <!-- 눈 — 사진 보내기와 카메라 -->
        <div id="eye-bar">
            <button id="eye-photo" title="사진 보여주기">🖼</button>
            <button id="eye-cam" title="카메라를 다이아 눈으로">📷</button>
            <button id="eye-mic" title="말로 걸기">🎤</button>
            <video id="eye-video" autoplay playsinline muted></video>
        </div>
        <input type="file" id="eye-file" accept="image/*" style="display:none">

        <!-- 체스판 -->
        <div id="chess-panel">
            <div id="chess-head">
                <span id="chess-turn">…</span>
                <button id="chess-new">새 판</button>
                <button id="chess-giveup">그만</button>
                <button id="chess-close">닫기</button>
            </div>
            <div id="chess-levels"></div>
            <div id="chess-sides"></div>
            <div id="chess-decide"></div>
            <div id="chess-board"></div>
            <div id="chess-taken"></div>
            <div id="chess-msg"></div>
        </div>

        <div id="go-panel">
            <div id="go-head">
                <span id="go-turn">…</span>
                <button id="go-new">새 판</button>
                <button id="go-giveup">그만</button>
                <button id="go-close">닫기</button>
            </div>
            <div id="go-levels"></div>
            <div id="go-board"></div>
            <div id="go-msg"></div>
        </div>

        <div id="hg-panel">
            <div id="hg-head">
                <span id="hg-turn">…</span>
                <button id="hg-new">새 판</button>
                <button id="hg-quit">그만</button>
                <button id="hg-close">닫기</button>
            </div>
            <div id="hg-levels"></div>
            <div id="hg-table">
                <div class="hg-side">
                    <div class="hg-cap">다이아</div>
                    <div class="hg-card" id="hg-card-dia">·</div>
                    <div class="hg-n"><span id="hg-hand-dia">0</span>장</div>
                </div>
                <div class="hg-side">
                    <div class="hg-cap">나</div>
                    <div class="hg-card" id="hg-card-you">·</div>
                    <div class="hg-n"><span id="hg-hand-you">0</span>장</div>
                </div>
            </div>
            <button id="hg-bell">🔔 종</button>
            <button id="hg-flip">한 장 뒤집기</button>
            <div id="hg-msg"></div>
        </div>

        <div id="jg-panel">
            <div id="jg-head">
                <span id="jg-turn">…</span>
                <button id="jg-new">새 판</button>
                <button id="jg-giveup">그만</button>
                <button id="jg-close">닫기</button>
            </div>
            <div id="jg-levels"></div>
            <div id="jg-board"></div>
            <div id="jg-msg"></div>
        </div>

        <!-- 선공 정하기 — 오목·장기·할리갈리·끝말잇기 -->
        <div id="first-box">
            <div id="first-title">…</div>
            <div id="first-btns"></div>
        </div>

        <!-- 누구로 들어와 있는가 -->
        <div id="who-badge">
            <span id="who-name">…</span>
            <button id="who-out" title="나가기">나가기</button>
        </div>

        <!-- 마우스로 걷기 -->
        <div id="stick-pad"><div id="stick-knob"></div></div>

        <div id="stick-keys">
            <button id="stick-jump" title="스페이스">점프</button>
            <button id="stick-sit" title="Shift">앉기</button>
        </div>

        <!-- 우클릭하면 뜨는 도구 고르기 -->
        <div id="tool-menu"></div>

        <!-- 옷장과 꾸미기 — 지금은 감춰 둔다(2026-09-30 사용자 요청).
             기능은 그대로라 display:none 만 지우면 다시 나온다. -->
        <div id="wear-bar" style="display:none">
            <div id="wear-menu"></div>
            <div id="look-menu"></div>
            <button id="look-open">💄 꾸미기</button>
            <button id="wear-open">👗 옷장</button>
        </div>

        <!-- 지금 어떤 사이이고 어떤 기분인지 -->
        <div id="state-panel">

            <div class="row">
                <span class="cap">호감</span>
                <span id="stage-label">…</span>
                <span id="affinity-num">0</span>
            </div>

            <div id="affinity-track">
                <div id="affinity-fill"></div>
                <div id="affinity-marks"></div>
                <div id="affinity-knob"></div>
            </div>

            <div class="row" style="margin-top:9px">
                <span class="cap">기분</span>
                <span id="mood-dot"></span>
                <span id="mood-label">평온</span>
            </div>

            <div id="mood-bars"></div>

            <div class="row" style="margin-top:9px; align-items:flex-start">
                <span class="cap">터치</span>
                <span id="touch-zones"></span>
            </div>

        </div>

        <div id="affinity-pop"></div>

    </div>

    <div id="chat-container">

        <div id="chat-header">
            diamondAI Chat
        </div>

        <div id="chat-messages"></div>

        <!-- 상황 — AI 가 지어 준 보기. 눌러서 고른다 -->
        <div id="situation-bar">
            <div id="situation-chips"></div>
            <div id="situation-row">
                <input
                    type="text"
                    id="situation-input"
                    placeholder="상황을 직접 쓰기 — 예: 다이아의 손을 잡는다"
                >
                <button id="situation-send" title="상황과 말을 함께 보내기">( )</button>
                <button id="situation-new" title="보기 다시 짓기">↻</button>
            </div>
        </div>

        <div id="chat-input-area">

            <input
                type="text"
                id="chat-input"
                placeholder="메시지를 입력하세요..."
            >

            <!-- 지난 이야기 펼치기. 좁은 화면에서만 보인다 —
                 거기서는 이야기 칸을 감춰 두고 다이아에게 자리를 준다. -->
            <button id="log-toggle" title="지난 이야기">💬</button>

            <button id="send-btn">
                전송
